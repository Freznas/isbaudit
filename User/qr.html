<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SG Bountyhunt — QR</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f7f7fb }
      .card { background: #fff; padding:24px; border-radius:12px; box-shadow: 0 6px 24px rgba(20,20,40,0.06); text-align:center; }
      img { width: 300px; height: 300px; }
      a.button { display:inline-block; margin-top:12px; padding:8px 12px; background:#1f6feb; color:#fff; border-radius:8px; text-decoration:none }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>SG Bountyhunt — Öppna spelet</h2>
      <p>Skanna QR-koden med din mobilkamera för att öppna spelet i webbläsaren.</p>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://isbaudit.vercel.app" alt="QR to SGBountyhunt" />
      <div>
        <a class="button" href="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://isbaudit.vercel.app" target="_blank" rel="noopener">Ladda ner PNG</a>
      </div>
      <p style="font-size:12px; color:#666; margin-top:10px">URL: https://isbaudit.vercel.app</p>
    </div>
  </body>
</html>
